<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Tu trabajo deja huella</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap">
<style>
/* Concepto: hoja blanca con esquinas onduladas en azul, tarjetas redondeadas con contorno de color y círculos de ícono, como las piezas del SGA. */
:root{
  --navy:#343265; --green:#2AA539; --orange:#E9521D; --lime:#72B92C; --amber:#F58220;
  --ink:#3F3F3F; --bg:#F5F7F9; --card:#FFFFFF; --line:#DDE2E8;
  --navy-tint:#E8E8F2; --green-tint:#E4F3E7; --orange-tint:#FDEBE3;
  --font:'Montserrat',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.5;
  padding-block:0 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-font-smoothing:antialiased;position:relative;overflow-x:hidden;min-height:100%}
.wave-tl{position:absolute;top:0;left:0;width:min(340px,70vw);height:auto;pointer-events:none;z-index:0}
.wave-br{position:absolute;bottom:0;right:0;width:min(420px,80vw);height:auto;pointer-events:none;z-index:0}
.wrap{position:relative;z-index:1;max-width:720px;margin:0 auto}
header.top{display:flex;justify-content:flex-end;align-items:flex-start;padding-top:16px;min-height:clamp(108px,30vw,128px)}
header.top img{height:44px;width:auto;display:block}
h1,h2,h3{color:var(--navy);margin:0;text-wrap:balance;line-height:1.12;font-weight:800}
h1{font-size:clamp(34px,8vw,52px);margin-top:10px}
h1 em{font-style:normal;color:var(--green)}
h2{font-size:clamp(24px,5.4vw,30px)}
h3{font-size:19px;font-weight:700}
p{margin:0}
.lead{font-size:18px;margin-top:14px;max-width:34em}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--green)}
.stack{display:flex;flex-direction:column;gap:16px}
.card{background:var(--card);border:2px solid var(--line);border-radius:24px;padding:22px}
.card.navy{border-color:var(--navy)} .card.green{border-color:var(--green)} .card.orange{border-color:var(--orange)}
.badge{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;flex:none}
.badge svg{width:28px;height:28px;stroke:#fff;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.b-navy{background:var(--navy)} .b-green{background:var(--green)} .b-orange{background:var(--orange)} .b-blue{background:#3A63B8}
.row{display:flex;gap:14px;align-items:center}
.btn{font:inherit;font-weight:700;font-size:16px;border:0;border-radius:999px;padding:14px 26px;cursor:pointer;background:var(--green);color:#fff;
  display:inline-flex;align-items:center;gap:10px;min-height:48px;transition:transform .12s,background .12s}
.btn:hover{background:#238f31} .btn:active{transform:translateY(1px)}
.btn.navy{background:var(--navy)} .btn.navy:hover{background:#2a2853}
.btn.ghost{background:transparent;color:var(--navy);border:2px solid var(--navy)} .btn.ghost:hover{background:var(--navy-tint)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
label.field{display:block;font-size:14px;font-weight:600;color:var(--navy);margin-top:26px}
input[type=text]{font:inherit;width:100%;margin-top:8px;padding:13px 16px;border:2px solid var(--line);border-radius:14px;background:#fff;color:var(--ink)}
input[type=text]:focus{border-color:var(--navy);outline:none;box-shadow:0 0 0 3px var(--navy-tint)}
.req{color:var(--orange)}
input[type=text].bad{border-color:var(--orange);background:var(--orange-tint)}
.err{color:#b23a0f;font-size:13px;font-weight:600;margin-top:6px}
fieldset.sedes{border:0;padding:0;margin:26px 0 0;min-width:0}
fieldset.sedes legend{font-size:14px;font-weight:600;color:var(--navy);padding:0;margin-bottom:10px}
.radios{display:grid;gap:10px}
@media(min-width:560px){.radios{grid-template-columns:1fr 1fr}}
.radio{display:flex;align-items:center;gap:12px;border:2px solid var(--line);border-radius:14px;padding:11px 14px;cursor:pointer;background:#fff;font-weight:600;font-size:15px;min-height:48px}
.radio:hover{border-color:var(--navy)}
.radio input{accent-color:var(--green);width:20px;height:20px;margin:0;flex:none}
.radio:has(input:checked){border-color:var(--green);background:var(--green-tint)}
.hint{font-size:13px;color:#6b7280;margin-top:6px}
/* progreso */
.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:6px 0 22px}
.steps div{height:7px;border-radius:4px;background:var(--line)}
.steps div.done{background:var(--green)} .steps div.now{background:var(--orange)}
.steplabel{display:flex;justify-content:space-between;font-size:12px;font-weight:600;color:#6b7280;margin-bottom:18px;gap:8px}
.steplabel b{color:var(--navy)}
/* cadena */
.chain{display:grid;grid-template-columns:1fr;gap:10px;margin-top:20px}
.link{border-radius:18px;padding:16px 18px;border:2px solid}
.link small{display:block;font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;margin-bottom:2px}
.link.a{border-color:var(--navy);background:var(--navy-tint)} .link.a small{color:var(--navy)}
.link.s{border-color:var(--orange);background:var(--orange-tint)} .link.s small{color:var(--orange)}
.link.i{border-color:var(--green);background:var(--green-tint)} .link.i small{color:#1d7f2a}
.arrow{justify-self:center;color:var(--navy);font-weight:800;font-size:20px;line-height:1}
@media(min-width:640px){.chain{grid-template-columns:1fr auto 1fr auto 1fr;align-items:stretch}.arrow{align-self:center}.arrow::before{content:"→"}.arrow span{display:none}}
.defs{display:grid;gap:14px;margin-top:22px}
@media(min-width:640px){.defs{grid-template-columns:1fr 1fr}}
.defs .card p{margin-top:8px}
/* retos */
.q{font-size:clamp(21px,5vw,26px);font-weight:800;color:var(--navy);line-height:1.2;margin-top:6px}
.opts{display:grid;gap:12px;margin-top:20px}
.opt{font:inherit;text-align:left;background:#fff;color:var(--ink);border:2px solid var(--line);border-radius:18px;padding:15px 18px;cursor:pointer;
  transition:border-color .12s,background .12s;display:block;width:100%}
.opt:hover:not([disabled]){border-color:var(--navy);background:var(--navy-tint)}
.opt .k{display:block;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--orange)}
.opt .k+span{display:block;font-weight:600;margin-bottom:8px}
.opt .k+span:last-child{margin-bottom:0}
.opt .k.imp{color:#1d7f2a}
.opt.ok{border-color:var(--green);background:var(--green-tint)}
.opt.bad{border-color:var(--orange);background:var(--orange-tint)}
.opt[disabled]{cursor:default}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px}
.pair .opt{text-align:center;font-weight:800;font-size:17px;color:var(--navy)}
.chip{display:inline-block;font-size:13px;font-weight:700;border-radius:999px;padding:5px 12px;background:var(--navy-tint);color:var(--navy);margin-top:14px}
.chip.o{background:var(--orange-tint);color:#b23a0f}
.fb{margin-top:18px;border-radius:18px;padding:16px 18px;background:#fff;border:2px solid var(--line)}
.fb.ok{border-color:var(--green)} .fb.bad{border-color:var(--orange)}
.fb strong{display:block;font-weight:800;color:var(--navy);margin-bottom:4px}
.fb .btn{margin-top:14px}
.commit{display:grid;gap:12px;margin-top:20px}
.commit .opt{font-weight:600}
.commit .opt.sel{border-color:var(--green);background:var(--green-tint)}
.note{margin-top:20px;border-radius:18px;background:var(--navy);color:#fff;padding:16px 20px;font-weight:500}
.note b{color:#9be28e}
/* resultado */
.score{display:flex;align-items:baseline;gap:8px;color:var(--navy)}
.score b{font-size:64px;font-weight:800;line-height:1}
.score span{font-size:22px;font-weight:700}
.bars{display:grid;gap:12px;margin-top:20px}
.bar{display:grid;grid-template-columns:minmax(0,150px) 1fr auto;gap:12px;align-items:center;font-size:14px;font-weight:600}
.track{height:12px;background:var(--line);border-radius:6px;overflow:hidden}
.fill{height:100%;background:var(--green);border-radius:6px}
.status{margin-top:18px;font-size:14px;font-weight:600;padding:12px 16px;border-radius:14px;background:var(--navy-tint);color:var(--navy)}
.status.ok{background:var(--green-tint);color:#1d6b27} .status.err{background:var(--orange-tint);color:#9c3209}
.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:22px}
/* panel */
#admin{margin-top:56px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:16px}
.kpi{background:#fff;border:2px solid var(--line);border-radius:18px;padding:14px 16px}
.kpi b{display:block;font-size:30px;font-weight:800;color:var(--navy);font-variant-numeric:tabular-nums;line-height:1.1}
.kpi span{font-size:13px;font-weight:600;color:#6b7280}
.tablewrap{overflow-x:auto;margin-top:16px;border:2px solid var(--line);border-radius:18px;background:#fff}
table{border-collapse:collapse;width:100%;min-width:560px;font-size:14px;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--navy);background:var(--navy-tint)}
tr:last-child td{border-bottom:0}
.empty{padding:22px;color:#6b7280;font-size:14px}
footer.end{margin-top:40px;font-size:13px;color:#6b7280}

.ctr{text-align:center}
.lead.ctr{margin-inline:auto}
.how{margin-top:18px;border-radius:18px;background:var(--navy-tint);border:2px solid var(--navy);padding:14px 18px;color:var(--navy);font-weight:600}
.how b{display:block;font-size:12px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:2px;color:var(--navy)}
.recap{display:grid;gap:10px;margin-top:20px}
@media(min-width:640px){.recap{grid-template-columns:1fr 1fr}}
.recap div{border-radius:16px;padding:12px 16px;border:2px solid;font-weight:600;font-size:15px}
.recap .ra{border-color:var(--orange);background:var(--orange-tint)} .recap .ri{border-color:var(--green);background:var(--green-tint)}
.recap small{display:block;font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}
.recap .ra small{color:var(--orange)} .recap .ri small{color:#1d7f2a}
ol.how-steps{list-style:none;counter-reset:s;margin:18px 0 0;padding:0;display:grid;gap:12px}
ol.how-steps li{counter-increment:s;display:flex;gap:14px;align-items:flex-start;font-size:17px;font-weight:500}
ol.how-steps li::before{content:counter(s);flex:none;width:34px;height:34px;border-radius:50%;background:var(--navy);color:#fff;font-weight:800;display:grid;place-items:center}
.err{color:#9c3209;font-weight:600;font-size:14px;margin-top:10px}
.radios{display:grid;gap:10px;margin-top:10px}
label.rad{display:flex;gap:12px;align-items:center;border:2px solid var(--line);border-radius:14px;padding:12px 16px;background:#fff;cursor:pointer;font-weight:600;font-size:15px}
label.rad:hover{border-color:var(--navy)}
label.rad input{width:20px;height:20px;accent-color:var(--green);flex:none;margin:0}
label.rad.on{border-color:var(--green);background:var(--green-tint)}
.actbox{margin-top:16px;border:2px solid var(--navy);border-radius:20px;background:#fff;padding:16px 20px}
.actbox small{display:block;font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--navy)}
.actbox .t{font-size:22px;font-weight:800;color:var(--navy);line-height:1.2;margin-top:2px}
.aspbox{margin-top:12px;border:2px solid var(--orange);border-radius:20px;background:var(--orange-tint);padding:16px 20px}
.aspbox small{display:block;font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--orange)}
.aspbox .t{font-size:19px;font-weight:700;color:var(--ink);line-height:1.3;margin-top:2px}
.bigq{font-size:clamp(26px,6.4vw,34px);font-weight:800;color:var(--navy);line-height:1.15;margin-top:26px;text-align:center;text-wrap:balance}
.bigq em{font-style:normal;color:var(--orange);text-decoration:underline;text-decoration-thickness:4px;text-underline-offset:6px}
.pair.big .opt{font-size:22px;padding:22px 12px}
.pair.big .opt.pos:hover:not([disabled]){border-color:var(--green);background:var(--green-tint)}
.pair.big .opt.neg:hover:not([disabled]){border-color:var(--orange);background:var(--orange-tint)}
.const{margin-top:14px;border:2px dashed var(--navy);border-radius:18px;background:#fff;padding:16px 18px;font-size:15px;line-height:1.7;user-select:text;-webkit-user-select:text;word-break:break-word}
.const b{color:var(--navy)}
.marco-form{width:100%;height:780px;border:2px solid var(--line);border-radius:18px;margin-top:12px;background:#fff;display:block}
.codigo{font-size:1.25rem;font-weight:800;letter-spacing:1px;color:var(--navy)}
[hidden]{display:none!important}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

function i1(){return intro(1,"Arma la cadena",["Lee la actividad de tu día a día.","Elige la opción que tiene el aspecto y el impacto que le corresponden.","Te explicamos la respuesta y sigues con la siguiente."],"","r1");}
function i2(){return intro(2,"¿Aspecto o impacto?",["Lee la frase.","Decide si es un aspecto o un impacto.","Te explicamos la respuesta y sigues con la siguiente."],"Si la frase nombra algo que hacemos o usamos, es un aspecto. Si nombra lo que le pasa al ambiente, es un impacto.","r2");}
function i3(){return intro(3,"¿Positivo o negativo?",["Lee la actividad. El aspecto ya te lo mostramos.","Decide si el <b>impacto</b> sobre el ambiente es positivo (lo beneficia) o negativo (lo afecta).","Te explicamos la respuesta y sigues con la siguiente."],"Un impacto también puede ser positivo. No todo lo que hacemos perjudica al ambiente.","r3");}
function opts1(q){
  var h='<div class="opts">';
  q.o.forEach(function(p,k){
    var cls=S.done?(k===q.c?' ok':(k===S.pick?' bad':'')):'';
    h+='<button class="opt'+cls+'" type="button" data-a="pick" data-k="'+k+'"'+(S.done?' disabled':'')+'><span class="k">Aspecto</span><span>'+esc(p[0])+'</span><span class="k imp">Impacto</span><span>'+esc(p[1])+'</span></button>';
  });
  return h+'</div>';
}
function fb(ok,why,last){
  return '<div class="fb '+(ok?'ok':'bad')+'" role="status"><strong>'+(ok?'Correcto':'Casi')+'</strong>'+esc(why)+
  '<div><button class="btn" data-a="next" type="button">'+(last?'Continuar':'Siguiente')+'</button></div></div>';
}
function r1(){
  var q=R1[S.i],ok=S.done&&S.pick===q.c;
  return prog(1)+'<div class="eyebrow ctr">Reto 1 · Arma la cadena · '+(S.i+1)+' de '+R1.length+'</div>'+
  '<div class="how"><b>Qué hacer</b>Elige la opción que tiene el aspecto y el impacto correctos para esta actividad.</div>'+
  '<p class="q ctr" style="margin-top:20px">'+esc(q.q)+'</p>'+opts1(q)+(S.done?fb(ok,q.w,S.i===R1.length-1):'');
}
function r2(){
  var q=R2[S.i],ok=S.done&&S.pick===q.a;
  function b(v,l){var c=S.done?(v===q.a?' ok':(v===S.pick?' bad':'')):'';return '<button class="opt'+c+'" type="button" data-a="pick" data-v="'+v+'"'+(S.done?' disabled':'')+'>'+l+'</button>';}
  return prog(2)+'<div class="eyebrow ctr">Reto 2 · ¿Aspecto o impacto? · '+(S.i+1)+' de '+R2.length+'</div>'+
  '<div class="how"><b>Qué hacer</b>Decide si esta frase es un aspecto (lo que hacemos o usamos) o un impacto (el cambio en el ambiente).</div>'+
  '<p class="q ctr" style="margin-top:20px">'+esc(q.t)+'</p><div class="pair">'+b("aspecto","Aspecto")+b("impacto","Impacto")+'</div>'+(S.done?fb(ok,q.w,S.i===R2.length-1):'');
}
function r3(){
  var q=R3[S.i],ok=S.done&&S.pick===q.r;
  function b(v,l,c2){var c=S.done?(v===q.r?' ok':(v===S.pick?' bad':'')):'';return '<button class="opt '+c2+c+'" type="button" data-a="pick" data-v="'+v+'"'+(S.done?' disabled':'')+'>'+l+'</button>';}
  return prog(3)+'<div class="eyebrow ctr">Reto 3 · ¿Positivo o negativo? · '+(S.i+1)+' de '+R3.length+'</div>'+
  '<div class="how"><b>Qué hacer</b>Ya te damos la actividad y su aspecto. Tú decides si el <u>impacto</u> en el ambiente es positivo o negativo.</div>'+
  '<div class="actbox"><small>Actividad</small><div class="t">'+esc(q.s)+'</div></div>'+
  '<div class="aspbox"><small>Aspecto</small><div class="t">'+esc(q.a)+'</div></div>'+
  '<p class="bigq">¿El <em>impacto</em> es positivo o negativo?</p>'+
  '<div class="pair big">'+b("positivo","Positivo","pos")+b("negativo","Negativo","neg")+'</div>'+(S.done?fb(ok,q.w,S.i===R3.length-1):'');
}
function commit(){
  var h=prog(4)+'<h2 class="ctr">Elige una acción para esta semana</h2>'+
  '<div class="how"><b>Qué hacer</b>Toca la acción que sí vas a hacer. Es una sola, la que más fácil te quede.</div><div class="commit">';
  COMP.forEach(function(c,k){h+='<button class="opt'+(S.commit===k?' sel':'')+'" type="button" data-a="comp" data-k="'+k+'" aria-pressed="'+(S.commit===k)+'">'+esc(c)+'</button>';});
  h+='</div><div class="note">Si identificas un aspecto o impacto durante tu trabajo, <b>repórtalo al Líder del SGA o al Responsable Ambiental de tu sede.</b></div>';
  h+='<div class="actions"><button class="btn" data-a="finish" type="button"'+(S.commit===null?' disabled':'')+'>Ver mi resultado</button></div>';
  return h;
}

/* ===== RESULTADO Y REGISTRO ===== */
function urlFormulario(incrustado){
  if(PREFILL.base&&PREFILL.puntaje&&PREFILL.codigo){
    var sep=PREFILL.base.indexOf("?")>=0?"&":"?";
    return PREFILL.base+sep+encodeURIComponent(PREFILL.puntaje)+"="+total()+"&"+encodeURIComponent(PREFILL.codigo)+"="+encodeURIComponent(S.codigo)+(incrustado?"&embed=true":"");
  }
  return null;
}
function registro(){
  var datos='<div class="const"><b>Resultado:</b> '+total()+' de '+TOTAL+'<br><b>Código:</b> <span class="codigo" id="codigo">'+esc(S.codigo)+'</span></div>';
  var h='<div class="card green" style="margin-top:14px"><div class="row">'+ic("form","b-green")+'<h3>Registra tu participación</h3></div>'+
   '<p style="margin-top:10px">Diligencia tus datos y envía el formulario. Así queda constancia de tu participación.</p>'+datos;
  var pre=urlFormulario(true),preLink=urlFormulario(false);
  if(pre){
    h+='<p class="hint">Tu resultado y tu código ya van incluidos en el formulario.</p><iframe class="marco-form" src="'+esc(pre)+'" title="Registro de participación" loading="lazy" allowfullscreen></iframe>'+
       '<p class="hint" style="margin-top:12px">¿No ves el formulario? Ábrelo aquí:</p><div class="actions" style="margin-top:8px"><a class="btn" href="'+esc(preLink)+'" target="_blank" rel="noopener">Abrir el registro</a></div>';
  }else if(FORM_EMBED){
    h+='<p class="hint">En el formulario escribe tu resultado y tu código exactamente como aparecen aquí.</p><iframe class="marco-form" src="'+esc(FORM_EMBED)+'" title="Registro de participación" loading="lazy" allowfullscreen></iframe>'+
       (FORM_LINK?'<p class="hint" style="margin-top:12px">¿No ves el formulario? Ábrelo aquí:</p><div class="actions" style="margin-top:8px"><a class="btn" href="'+esc(FORM_LINK)+'" target="_blank" rel="noopener">Abrir el registro</a></div>':'');
  }else{
    h+='<p class="hint">Guarda tu resultado y tu código: los necesitarás para el registro.</p>';
  }
  h+='<div class="actions"><button class="btn navy" data-a="copy" type="button">Copiar resultado y código</button></div><p class="hint" id="copyMsg" role="status"></p></div>';
  return h;
}
function result(){
  var t=total(),lo=Math.round(TOTAL*0.6),hi=Math.round(TOTAL*0.85);
  var msg=t>=hi?"Ya lees tu trabajo en términos de aspectos e impactos.":t>=lo?"Vas bien. Quedan algunos matices por afinar y los puedes repasar cuando quieras.":"Es un buen punto de partida. Vuelve a los conceptos y prueba otra vez.";
  var names=["Reto 1 · Arma la cadena","Reto 2 · Aspecto o impacto","Reto 3 · Positivo o negativo"];
  var bars="";for(var k=0;k<3;k++)bars+='<div class="bar"><span>'+names[k]+'</span><div class="track"><div class="fill" style="width:'+Math.round(S.sc[k]/MAXR[k]*100)+'%"></div></div><span>'+S.sc[k]+'/'+MAXR[k]+'</span></div>';
  return '<div class="eyebrow ctr">Tu resultado</div><div class="score" style="justify-content:center"><b>'+t+'</b><span>de '+TOTAL+'</span></div>'+
  '<p class="lead ctr" style="margin-top:8px">'+msg+'</p><div class="card navy" style="margin-top:20px"><h3>Cómo te fue en cada reto</h3><div class="bars">'+bars+'</div></div>'+
  '<div class="card" style="margin-top:14px"><div class="row">'+ic("check","b-navy")+'<div><div class="eyebrow">Tu compromiso de esta semana</div><p style="font-weight:700;color:var(--navy);margin-top:2px">'+esc(COMP[S.commit])+'</p></div></div></div>'+
  registro()+
  '<div class="actions"><button class="btn ghost" data-a="again" type="button">Hacerlo de nuevo</button></div>'+
  '<p class="hint">Si lo repites, tu nuevo resultado reemplaza al anterior y recibirás un código nuevo.</p>';
}
function draw(){
  var f={home:home,concept:concept,i1:i1,r1:r1,i2:i2,r2:r2,i3:i3,r3:r3,commit:commit,result:result}[S.scr];
  app.innerHTML=f();
}
function next(list,nextScr){
  if(S.i<list.length-1){S.i++;S.done=false;S.pick=null;draw();}else go(nextScr);
}
async function copyIt(){
  var m=document.getElementById("copyMsg"),t="Resultado: "+total()+" de "+TOTAL+"\nCódigo: "+S.codigo,done=false;
  try{await navigator.clipboard.writeText(t);done=true;}catch(e){}
  if(!done){try{var ta=document.createElement("textarea");ta.value=t;ta.setAttribute("readonly","");ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();done=document.execCommand("copy");document.body.removeChild(ta);}catch(e){}}
  if(m)m.textContent=done?"Copiado.":"No se pudo copiar. Mantén presionado el recuadro de arriba para seleccionar el texto.";
}
app.addEventListener("click",function(e){
  var el=e.target.closest("[data-a]");if(!el||el.disabled)return;
  var a=el.getAttribute("data-a");
  if(a==="start")go("concept");
  else if(a==="i1"||a==="r1"||a==="r2"||a==="r3")go(a);
  else if(a==="pick"&&!S.done){
    if(S.scr==="r1"){var k=+el.getAttribute("data-k");S.pick=k;S.done=true;if(k===R1[S.i].c)S.sc[0]++;}
    else{var v=el.getAttribute("data-v");S.pick=v;S.done=true;
      if(S.scr==="r2"&&v===R2[S.i].a)S.sc[1]++;
      if(S.scr==="r3"&&v===R3[S.i].r)S.sc[2]++;}
    draw();
    var f=app.querySelector(".fb .btn");if(f){f.focus({preventScroll:true});f.scrollIntoView({block:"center",behavior:"smooth"});}
  }
  else if(a==="next"){
    if(S.scr==="r1")next(R1,"i2");else if(S.scr==="r2")next(R2,"i3");else if(S.scr==="r3")next(R3,"commit");
    window.scrollTo({top:0,behavior:"smooth"});
  }
  else if(a==="comp"){S.commit=+el.getAttribute("data-k");draw();}
  else if(a==="finish"){S.codigo=generarCodigo(total());guardar();go("result");}
  else if(a==="copy")copyIt();
  else if(a==="again"){S.sc=[0,0,0];S.commit=null;S.codigo=null;go("concept");}
});
draw();
})();
</script>

</body>
</html>
